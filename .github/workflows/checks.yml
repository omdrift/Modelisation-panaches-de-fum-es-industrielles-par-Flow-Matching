name: Forecasting software checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime from the canonical environment
        run: |
          python -m pip install PyYAML==6.0.2
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          dependencies = yaml.safe_load(Path('environment_scientific.yml').read_text())['dependencies']
          packages = next(item['pip'] for item in dependencies if isinstance(item, dict) and 'pip' in item)
          packages = [item for item in packages if not item.startswith(('--', 'torch==', 'torchvision=='))]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *packages], check=True)
          PY
      - name: Check public interfaces and behavior
        run: python -m pytest -q
      - name: Compile source files
        run: python -m compileall -q scientific model training lutils tools tests
