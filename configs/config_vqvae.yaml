name: "vqvae_sky_hd_source"

encoder:
  in_channels: 3
  out_channels: 64      # Redescendu à 64 pour une meilleure convergence (plus stable que 256)
  mid_channels: 128 

decoder:
  in_channels: 64
  out_channels: 3
  mid_channels: 128

vector_quantizer:
  embedding_dimension: 64 
  num_embeddings: 1024  # Assez large pour couvrir les teintes matin/nuit
  commitment_cost: 0.25 # Valeur stable pour éviter que le codebook ne diverge

data:
  data_root: "final_dataset"
  input_size: 128       # Meilleur compromis pour du 1080p source
  crop_size: 128
  random_horizontal_flip: True

training:
  batch_size: 32        # Stable sur gros GPU
  learning_rate: 2e-4
  weight_decay: 1e-6
  epochs: 100
# Minimal model & evaluation entries required by project
model:
  reference: True

evaluation:
  past_horizon: -1
  warm_sampling: 0.0
  steps: 100


